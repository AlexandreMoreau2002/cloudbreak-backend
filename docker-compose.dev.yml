services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: cloudbreak-backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/cloudbreak
      - REDIS_URL=redis://redis:6379
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    container_name: cloudbreak-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=cloudbreak
    volumes:
      - cloudbreak_db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: cloudbreak-redis
    ports:
      - "6379:6379"

volumes:
  cloudbreak_db_data:
