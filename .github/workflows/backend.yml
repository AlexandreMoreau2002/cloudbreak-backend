name: Backend CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # --- 1. Build ---
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # --- 2. Lint ---
      - name: Ruff lint
        run: ruff check .

      - name: Mypy
        run: mypy app/

      # --- 3. Test ---
      - name: Pytest
        run: pytest
